name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - uses: gitleaks/gitleaks-action@v2

  integration:
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: docker compose up -d localstack
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4566/_localstack/health >/dev/null; then
              echo "LocalStack is up"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become healthy in time" >&2
          exit 1
      - uses: hashicorp/setup-terraform@v3
      - run: pip install terraform-local awscli-local
      - name: Apply infra against LocalStack
        working-directory: infra
        run: |
          tflocal init
          tflocal apply -auto-approve
      - name: Seed tenants
        run: go run ./scripts/seed_tenants.go
      - name: Run integration tests
        run: go test -tags integration ./...

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install terraform-local
      - uses: hashicorp/setup-terraform@v3
      - run: docker compose up -d localstack
      - working-directory: infra
        run: terraform fmt -check -recursive && tflocal init && tflocal validate && tflocal plan
