<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="One chat completion request flows through validation, auth, rate limit, budget reserve, routing and resilience to a model backend, then settles budget and emits usage and trace records; only the model backends are non-deterministic." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e6edf3"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <text x="20" y="22" font-size="11" fill="#8b949e" text-anchor="start">five-block reference model</text>
  <polyline points="148,52 148,42 520,42 520,52" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="334.0" y="36" font-size="11" fill="#8b949e" text-anchor="middle">Gateway</text>
  <polyline points="568,52 568,42 944,42 944,52" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="756.0" y="36" font-size="11" fill="#8b949e" text-anchor="middle">Deterministic orchestrator</text>
  <polyline points="992,52 992,42 1176,42 1176,52" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="1084.0" y="36" font-size="11" fill="#8b949e" text-anchor="middle">Model + tools</text>
  <rect x="20" y="96" width="80" height="64" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="60.0" y="133" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">client</text>
  <rect x="148" y="96" width="92" height="64" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="194.0" y="118" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">api</text>
  <text x="194.0" y="134" font-size="10.5" fill="#8b949e" text-anchor="middle">validate body</text>
  <text x="194.0" y="148" font-size="10.5" fill="#8b949e" text-anchor="middle">request id</text>
  <rect x="288" y="96" width="92" height="64" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="334.0" y="118" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">auth</text>
  <text x="334.0" y="134" font-size="10.5" fill="#8b949e" text-anchor="middle">key hash</text>
  <text x="334.0" y="148" font-size="10.5" fill="#8b949e" text-anchor="middle">GetItem</text>
  <rect x="428" y="96" width="92" height="64" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="474.0" y="118" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">ratelimit</text>
  <text x="474.0" y="134" font-size="10.5" fill="#8b949e" text-anchor="middle">in-memory</text>
  <text x="474.0" y="148" font-size="10.5" fill="#8b949e" text-anchor="middle">rpm / tenant</text>
  <rect x="568" y="96" width="96" height="64" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="616.0" y="118" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">budget</text>
  <text x="616.0" y="134" font-size="10.5" fill="#8b949e" text-anchor="middle">reserve</text>
  <text x="616.0" y="148" font-size="10.5" fill="#8b949e" text-anchor="middle">atomic hold</text>
  <rect x="712" y="96" width="92" height="64" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="758.0" y="118" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">router</text>
  <text x="758.0" y="134" font-size="10.5" fill="#8b949e" text-anchor="middle">alias x tier</text>
  <text x="758.0" y="148" font-size="10.5" fill="#8b949e" text-anchor="middle">cascade</text>
  <rect x="852" y="96" width="92" height="64" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="898.0" y="118" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">resilience</text>
  <text x="898.0" y="134" font-size="10.5" fill="#8b949e" text-anchor="middle">retry, cap 2</text>
  <text x="898.0" y="148" font-size="10.5" fill="#8b949e" text-anchor="middle">then fallback</text>
  <rect x="992" y="96" width="184" height="64" rx="6" fill="#0d2d4f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="1084" y="118" font-size="12.5" fill="#58a6ff" text-anchor="middle" font-weight="600">model backends</text>
  <text x="1084" y="134" font-size="10.5" fill="#58a6ff" text-anchor="middle">Ollama / OpenRouter</text>
  <text x="1084" y="148" font-size="10.5" fill="#58a6ff" text-anchor="middle">Gemini</text>
  <text x="1084" y="176" font-size="10.5" fill="#58a6ff" text-anchor="middle">non-deterministic</text>
  <line x1="100" y1="128.0" x2="146" y2="128.0" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="124.0" y="84" font-size="11" fill="#8b949e" text-anchor="middle">POST /v1/chat</text>
  <line x1="240" y1="128.0" x2="286" y2="128.0" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="264.0" y="84" font-size="11" fill="#8b949e" text-anchor="middle">resolves key</text>
  <line x1="380" y1="128.0" x2="426" y2="128.0" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="404.0" y="84" font-size="11" fill="#8b949e" text-anchor="middle">admits tenant</text>
  <line x1="520" y1="128.0" x2="566" y2="128.0" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="544.0" y="84" font-size="11" fill="#8b949e" text-anchor="middle">reserves tokens</text>
  <line x1="664" y1="128.0" x2="710" y2="128.0" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="688.0" y="84" font-size="11" fill="#8b949e" text-anchor="middle">resolves cascade</text>
  <line x1="804" y1="128.0" x2="850" y2="128.0" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="828.0" y="84" font-size="11" fill="#8b949e" text-anchor="middle">calls in order</text>
  <line x1="944" y1="128.0" x2="990" y2="128.0" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="968.0" y="84" font-size="11" fill="#8b949e" text-anchor="middle">retries / falls back</text>
  <rect x="148" y="186" width="1028" height="34" rx="6" fill="#21262d" stroke="#e6edf3" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="160" y="208" font-size="11" fill="#8b949e" text-anchor="start">Observability · one trace_event per stage (metadata only) → DynamoDB requests + trace_events · OTel spans + metrics</text>
  <line x1="194.0" y1="160" x2="194.0" y2="186" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="334.0" y1="160" x2="334.0" y2="186" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="474.0" y1="160" x2="474.0" y2="186" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="616.0" y1="160" x2="616.0" y2="186" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="758.0" y1="160" x2="758.0" y2="186" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="898.0" y1="160" x2="898.0" y2="186" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="1084" y1="182" x2="1084" y2="186" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="274" y="258" width="120" height="52" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="334" y="280" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">DynamoDB</text>
  <text x="334" y="297" font-size="10.5" fill="#8b949e" text-anchor="middle">tenants</text>
  <line x1="334" y1="220" x2="334" y2="256" stroke="#8b949e" stroke-width="1.5" marker-end="url(#am)"/>
  <text x="402" y="244" font-size="10.5" fill="#8b949e" text-anchor="start">GetItem by key hash</text>
  <rect x="548" y="258" width="148" height="52" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="622" y="280" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">DynamoDB</text>
  <text x="622" y="297" font-size="10.5" fill="#8b949e" text-anchor="middle">budgets + reservations</text>
  <line x1="622" y1="220" x2="622" y2="256" stroke="#8b949e" stroke-width="1.5" marker-end="url(#am)"/>
  <text x="704" y="244" font-size="10.5" fill="#8b949e" text-anchor="start">UpdateItem, conditional</text>
  <polyline points="1084,220 1084,352 598,352 598,378" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="860" y="342" font-size="11" fill="#8b949e" text-anchor="middle">returns real usage → settle</text>
  <rect x="500" y="380" width="196" height="60" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="598" y="404" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">budget.settle</text>
  <text x="598" y="422" font-size="10.5" fill="#8b949e" text-anchor="middle">releases the estimate</text>
  <rect x="740" y="380" width="196" height="60" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="838" y="404" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">usage</text>
  <text x="838" y="422" font-size="10.5" fill="#8b949e" text-anchor="middle">SQS usage-events → DLQ</text>
  <line x1="698" y1="410" x2="738" y2="410" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="718" y="370" font-size="10.5" fill="#8b949e" text-anchor="middle">publishes</text>
  <rect x="980" y="380" width="196" height="60" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1078" y="404" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="600">Approval gate</text>
  <text x="1078" y="422" font-size="10.5" fill="#8b949e" text-anchor="middle">n/a, no irreversible action</text>
  <line x1="1006" y1="400" x2="1150" y2="400" stroke="#8b949e" stroke-width="1.2"/>
</svg>
