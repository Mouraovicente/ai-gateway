<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The same gateway binary runs locally against LocalStack, Ollama and an OTel collector, or on AWS behind an ALB as an ECS Fargate task talking to DynamoDB, SQS, Secrets Manager and the hosted model providers." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e6edf3"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <line x1="596" y1="24" x2="596" y2="596" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="24" y="34" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="600">local · docker compose</text>
  <text x="620" y="34" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="600">AWS · Terraform, enable_fargate = true</text>
  <rect x="40" y="58" width="240" height="54" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="160" y="80" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">gateway container</text>
  <text x="160" y="98" font-size="10.5" fill="#8b949e" text-anchor="middle">listens :8080</text>
  <rect x="40" y="168" width="240" height="60" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="160" y="190" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">LocalStack :4566</text>
  <text x="160" y="206" font-size="10.5" fill="#8b949e" text-anchor="middle">DynamoDB 5 tables</text>
  <text x="160" y="220" font-size="10.5" fill="#8b949e" text-anchor="middle">SQS usage-events + DLQ</text>
  <line x1="160" y1="112" x2="160" y2="166" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="168" y="144" font-size="10.5" fill="#8b949e" text-anchor="start">reads / writes</text>
  <rect x="320" y="168" width="244" height="60" rx="6" fill="#0d2d4f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="442" y="190" font-size="12.5" fill="#58a6ff" text-anchor="middle" font-weight="600">Ollama on host</text>
  <text x="442" y="206" font-size="10.5" fill="#58a6ff" text-anchor="middle">http://host.docker.internal</text>
  <text x="442" y="220" font-size="10.5" fill="#58a6ff" text-anchor="middle">:11434</text>
  <polyline points="280,85 442,85 442,166" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="450" y="76" font-size="10.5" fill="#58a6ff" text-anchor="start">generates tokens</text>
  <rect x="40" y="276" width="240" height="46" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="160" y="298" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">OTel Collector</text>
  <text x="160" y="314" font-size="10.5" fill="#8b949e" text-anchor="middle">OTLP/HTTP :4318</text>
  <polyline points="280,99 300,99 300,299 284,299" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="306" y="262" font-size="10.5" fill="#8b949e" text-anchor="start">exports spans + metrics</text>
  <rect x="40" y="372" width="112" height="46" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="96" y="394" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="600">Tempo</text>
  <text x="96" y="410" font-size="10.5" fill="#8b949e" text-anchor="middle">:3200</text>
  <rect x="168" y="372" width="112" height="46" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="224" y="394" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="600">Prometheus</text>
  <text x="224" y="410" font-size="10.5" fill="#8b949e" text-anchor="middle">:9090</text>
  <line x1="96" y1="322" x2="96" y2="370" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="88" y="350" font-size="10.5" fill="#8b949e" text-anchor="end">traces</text>
  <line x1="224" y1="322" x2="224" y2="370" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="232" y="350" font-size="10.5" fill="#8b949e" text-anchor="start">metrics</text>
  <rect x="40" y="468" width="240" height="46" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="160" y="490" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">Grafana</text>
  <text x="160" y="506" font-size="10.5" fill="#8b949e" text-anchor="middle">:3000</text>
  <line x1="96" y1="418" x2="96" y2="466" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="224" y1="418" x2="224" y2="466" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="160" y="444" font-size="10.5" fill="#8b949e" text-anchor="middle">queries both</text>
  <rect x="620" y="58" width="260" height="54" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="750" y="80" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">ALB</text>
  <text x="750" y="98" font-size="10.5" fill="#8b949e" text-anchor="middle">HTTPS 443 · HTTP 80 → 301</text>
  <rect x="920" y="58" width="140" height="54" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="990" y="82" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">client</text>
  <text x="990" y="99" font-size="10.5" fill="#8b949e" text-anchor="middle">public DNS</text>
  <line x1="918" y1="85" x2="884" y2="85" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="901" y="50" font-size="10.5" fill="#8b949e" text-anchor="middle">sends request</text>
  <rect x="620" y="168" width="260" height="64" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="750" y="190" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">ECS Fargate task</text>
  <text x="750" y="206" font-size="10.5" fill="#8b949e" text-anchor="middle">distroless, non-root, :8080</text>
  <text x="750" y="222" font-size="10.5" fill="#8b949e" text-anchor="middle">health check GET /readyz</text>
  <line x1="750" y1="112" x2="750" y2="166" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="758" y="144" font-size="10.5" fill="#8b949e" text-anchor="start">forwards HTTP 8080</text>
  <rect x="920" y="168" width="256" height="64" rx="6" fill="#0d2d4f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="1048" y="190" font-size="12.5" fill="#58a6ff" text-anchor="middle" font-weight="600">OpenRouter / Gemini</text>
  <text x="1048" y="206" font-size="10.5" fill="#58a6ff" text-anchor="middle">HTTPS 443</text>
  <text x="1048" y="222" font-size="10.5" fill="#58a6ff" text-anchor="middle">non-deterministic</text>
  <line x1="882" y1="200" x2="918" y2="200" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ac)"/>
  <rect x="620" y="312" width="136" height="58" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="688.0" y="336" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">DynamoDB</text>
  <text x="688.0" y="353" font-size="10" fill="#8b949e" text-anchor="middle">5 tables</text>
  <polyline points="750,232 750,276 688.0,276 688.0,310" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="688.0" y="268" font-size="10" fill="#8b949e" text-anchor="middle">reads / writes</text>
  <rect x="772" y="312" width="136" height="58" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="840.0" y="336" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">SQS</text>
  <text x="840.0" y="353" font-size="10" fill="#8b949e" text-anchor="middle">usage-events → DLQ</text>
  <polyline points="750,232 750,276 840.0,276 840.0,310" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="840.0" y="268" font-size="10" fill="#8b949e" text-anchor="middle">publishes</text>
  <rect x="924" y="312" width="122" height="58" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="985.0" y="336" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">Secrets Manager</text>
  <text x="985.0" y="353" font-size="10" fill="#8b949e" text-anchor="middle">provider_secret_arns</text>
  <polyline points="750,232 750,276 985.0,276 985.0,310" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="985.0" y="268" font-size="10" fill="#8b949e" text-anchor="middle">injects at start</text>
  <rect x="1062" y="312" width="114" height="58" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="1119.0" y="336" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">CloudWatch Logs</text>
  <text x="1119.0" y="353" font-size="10" fill="#8b949e" text-anchor="middle">awslogs driver</text>
  <polyline points="750,232 750,276 1119.0,276 1119.0,310" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1119.0" y="268" font-size="10" fill="#8b949e" text-anchor="middle">ships stdout</text>
  <rect x="620" y="424" width="300" height="46" rx="6" fill="none" stroke="#e6edf3" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="770" y="446" font-size="12" fill="#8b949e" text-anchor="middle">OTel Collector · OTLP exporter</text>
  <text x="770" y="462" font-size="10.5" fill="#8b949e" text-anchor="middle">optional</text>
  <polyline points="640,232 606,232 606,447 618,447" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#am)"/>
  <text x="614" y="400" font-size="10.5" fill="#8b949e" text-anchor="start">exports if configured</text>
</svg>
