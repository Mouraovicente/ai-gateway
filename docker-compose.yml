# Local development environment ONLY.
#
# Every port below is bound to 127.0.0.1 on purpose: Grafana ships with a
# throwaway admin password, the OTLP receiver accepts any telemetry, and
# LocalStack accepts any credentials. None of this should ever be reachable
# from a network you do not control, and none of it is a production setup.
services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - USAGE_QUEUE_NAME=usage-events
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # Set STORE_BACKEND=memory to run with no AWS at all (tenants from
      # config/tenants.dev.yaml, budgets/traces/usage in process memory).
      # Local development and benchmarks only — see internal/memstore.
      # - STORE_BACKEND=memory
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started

  localstack:
    image: localstack/localstack:3
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=dynamodb,sqs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4318:4318"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"

  # Dev only. Bound to 127.0.0.1 like every other service in this file, so
  # nothing here is reachable from the network the machine sits on.
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # Deliberately weak default for a throwaway local dashboard; override
      # with GF_ADMIN_PASSWORD if this box is not yours alone.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-dev-only-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - tempo
