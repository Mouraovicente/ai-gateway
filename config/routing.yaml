aliases:
  nuva/fast:
    tiers:
      free:
        - provider: ollama
          model: qwen2.5-coder:1.5b
      standard:
        - provider: ollama
          model: qwen2.5-coder:1.5b
        - provider: openrouter
          model: openai/gpt-4o-mini
      premium:
        - provider: openrouter
          model: openai/gpt-4o-mini
  nuva/smart:
    tiers:
      free:
        - provider: ollama
          model: phi4-mini
      standard:
        - provider: openrouter
          model: openai/gpt-4o
      premium:
        - provider: gemini
          model: gemini-1.5-pro
providers:
  ollama:
    base_url: http://localhost:11434
  openrouter:
    base_url: https://openrouter.ai/api
    api_key_env: OPENROUTER_API_KEY
  gemini:
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
